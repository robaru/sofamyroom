# Python package: tests on the three platforms, wheels with cibuildwheel,
# upload to PyPI on a version tag (trusted publishing, no API token).
name: python

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Upload the wheels to TestPyPI"
        type: boolean
        default: false

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: zlib for libmysofa (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install zlib:x64-windows-static-md
          echo "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
      - name: Build the command line tool (for the parity test)
        if: runner.os != 'Windows'
        run: |
          cmake -S src -B build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake --parallel
          ctest --test-dir build/cmake --output-on-failure || true
      - name: Install
        run: python -m pip install -e ".[tests]"
      - name: Lint
        run: ruff check python tests examples
      - name: Test
        run: pytest -q

  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # manylinux x86_64
          - os: ubuntu-24.04-arm     # manylinux aarch64
          - os: macos-latest         # universal2 (arm64 + x86_64)
          - os: windows-latest       # AMD64
    steps:
      - uses: actions/checkout@v7
      - name: zlib for libmysofa (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows-static-md
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          # the wheel is py3-none (ctypes): one build per platform is enough,
          # the test job above covers the Python versions
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_MACOS: universal2
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_BEFORE_ALL_LINUX: dnf install -y zlib-devel || yum install -y zlib-devel
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {project}/tests
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to ${{ (startsWith(github.ref, 'refs/tags/v') && 'PyPI') || 'TestPyPI' }}
    needs: [test, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.testpypi
    runs-on: ubuntu-latest
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') && 'pypi') || 'testpypi' }}
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
