# Read the Docs configuration, https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - zlib1g-dev   # libmysofa; CMake and ninja come from PyPI via scikit-build-core

sphinx:
  configuration: src/docsrc/sphinx/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
